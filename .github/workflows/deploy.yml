# Deploy automático: todo push no main publica em produção.
# O GitHub entra no servidor por SSH com uma chave que só consegue rodar scripts/deploy.sh
# (comando forçado no authorized_keys), então o passo a passo real está naquele script.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY      chave privada de deploy
#   DEPLOY_HOST         IP ou domínio do servidor
#   DEPLOY_USER         usuário SSH
#   DEPLOY_KNOWN_HOSTS  chave pública do servidor (linha do known_hosts)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; os seguintes esperam na fila em vez de cancelar o que está rodando.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar em produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Conferir segredos
        id: segredos
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::warning::Segredos de deploy não configurados; nada foi publicado. Veja DEPLOY.md."
            echo "prontos=false" >> "$GITHUB_OUTPUT"
          else
            echo "prontos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar no servidor
        if: steps.segredos.outputs.prontos == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave tem comando forçado no servidor: a conexão roda scripts/deploy.sh e nada mais.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST"
